<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Menu animation options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=Syne:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --ink:#f4f1ea; --dim:#a8a39a; --faint:#5a564f;
    --accent:#d8ff3a; --line:rgba(244,241,234,.12); --line2:rgba(244,241,234,.32);
    --ease:cubic-bezier(0.22,1,0.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;padding:48px clamp(20px,5vw,72px);min-height:100vh}
  h1{font-family:Fraunces,serif;font-weight:300;font-size:clamp(30px,4vw,52px);letter-spacing:-.02em;margin-bottom:10px}
  .sub{color:var(--dim);font-size:14px;margin-bottom:44px;max-width:60ch;line-height:1.6}
  .triggers{display:flex;flex-wrap:wrap;gap:12px}
  .trig{
    font-family:Syne,sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);background:transparent;border:1px solid var(--line2);border-radius:999px;
    padding:14px 22px;cursor:pointer;transition:background .2s,color .2s,border-color .2s;
  }
  .trig:hover{background:var(--accent);color:#0b0b0c;border-color:var(--accent)}
  .trig small{display:block;font-family:Inter;font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint);font-size:11px;margin-top:4px}
  .trig:hover small{color:#0b0b0c}

  /* ---------- shared overlay ---------- */
  .demo-menu{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;flex-direction:column;justify-content:space-between;
    gap:48px;padding:104px clamp(20px,6vw,64px) 56px;
    visibility:hidden;pointer-events:none;
  }
  .demo-menu.is-open{visibility:visible;pointer-events:auto}
  .demo-close{
    position:absolute;top:32px;right:clamp(20px,6vw,64px);z-index:5;
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    background:none;border:1px solid var(--line2);border-radius:50%;color:var(--ink);font-size:20px;cursor:pointer;
  }
  .demo-nav{display:flex;flex-direction:column;gap:4px}
  .demo-nav a{display:block;overflow:hidden;font-family:Fraunces,serif;font-weight:300;
    font-size:clamp(38px,11vw,64px);letter-spacing:-.025em;line-height:1.15;color:var(--ink);text-decoration:none}
  .demo-nav a.cta{color:var(--accent);font-style:italic}
  .demo-nav a > span{display:inline-block}
  .demo-foot{font-family:Syne,sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
    padding-top:24px;border-top:1px solid var(--line)}
  .variant-tag{position:absolute;top:38px;left:clamp(20px,6vw,64px);font-family:Syne;font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}

  /* ============ 1 · CURTAIN + CASCADE ============ */
  .v-curtain{clip-path:inset(0 0 100% 0);transition:clip-path .55s var(--ease),visibility 0s linear .55s}
  .v-curtain.is-open{clip-path:inset(0 0 0 0);transition:clip-path .6s var(--ease)}
  .v-curtain .demo-nav a > span{transform:translateY(110%);transition:transform .6s var(--ease)}
  .v-curtain.is-open .demo-nav a > span{transform:translateY(0)}
  .v-curtain.is-open .demo-nav a:nth-child(1) > span{transition-delay:.16s}
  .v-curtain.is-open .demo-nav a:nth-child(2) > span{transition-delay:.23s}
  .v-curtain.is-open .demo-nav a:nth-child(3) > span{transition-delay:.30s}
  .v-curtain.is-open .demo-nav a:nth-child(4) > span{transition-delay:.37s}
  .v-curtain.is-open .demo-nav a:nth-child(5) > span{transition-delay:.44s}

  /* ============ 2 · CIRCLE EXPAND ============ */
  .v-circle{clip-path:circle(0% at calc(100% - 40px) 54px);transition:clip-path .6s var(--ease),visibility 0s linear .6s}
  .v-circle.is-open{clip-path:circle(150% at calc(100% - 40px) 54px);transition:clip-path .7s var(--ease)}
  .v-circle .demo-nav a > span{opacity:0;transform:translateY(20px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
  .v-circle.is-open .demo-nav a > span{opacity:1;transform:translateY(0)}
  .v-circle.is-open .demo-nav a:nth-child(1) > span{transition-delay:.30s}
  .v-circle.is-open .demo-nav a:nth-child(2) > span{transition-delay:.36s}
  .v-circle.is-open .demo-nav a:nth-child(3) > span{transition-delay:.42s}
  .v-circle.is-open .demo-nav a:nth-child(4) > span{transition-delay:.48s}
  .v-circle.is-open .demo-nav a:nth-child(5) > span{transition-delay:.54s}

  /* ============ 3 · SLIDE PANEL (from right) ============ */
  .v-slide{transform:translateX(100%);transition:transform .5s var(--ease),visibility 0s linear .5s}
  .v-slide.is-open{transform:translateX(0);transition:transform .55s var(--ease)}
  .v-slide .demo-nav a > span{opacity:0;transform:translateX(40px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .v-slide.is-open .demo-nav a > span{opacity:1;transform:translateX(0)}
  .v-slide.is-open .demo-nav a:nth-child(1) > span{transition-delay:.18s}
  .v-slide.is-open .demo-nav a:nth-child(2) > span{transition-delay:.24s}
  .v-slide.is-open .demo-nav a:nth-child(3) > span{transition-delay:.30s}
  .v-slide.is-open .demo-nav a:nth-child(4) > span{transition-delay:.36s}
  .v-slide.is-open .demo-nav a:nth-child(5) > span{transition-delay:.42s}

  /* ============ 4 · SPLIT (panels part to reveal) ============ */
  .v-split{background:transparent}
  .v-split::before,.v-split::after{content:"";position:absolute;top:0;bottom:0;width:50%;background:var(--bg);z-index:-1;transition:transform .6s var(--ease)}
  .v-split::before{left:0;transform:translateX(-100%)}
  .v-split::after{right:0;transform:translateX(100%)}
  .v-split{transition:visibility 0s linear .6s}
  .v-split.is-open::before{transform:translateX(0)}
  .v-split.is-open::after{transform:translateX(0)}
  .v-split .demo-nav a > span{opacity:0;transform:translateY(24px);transition:opacity .45s var(--ease),transform .45s var(--ease)}
  .v-split.is-open .demo-nav a > span{opacity:1;transform:translateY(0)}
  .v-split.is-open .demo-nav a:nth-child(1) > span{transition-delay:.34s}
  .v-split.is-open .demo-nav a:nth-child(2) > span{transition-delay:.40s}
  .v-split.is-open .demo-nav a:nth-child(3) > span{transition-delay:.46s}
  .v-split.is-open .demo-nav a:nth-child(4) > span{transition-delay:.52s}
  .v-split.is-open .demo-nav a:nth-child(5) > span{transition-delay:.58s}

  /* ============ 5 · KINETIC (skew slide, snappy) ============ */
  .v-kinetic{opacity:0;transition:opacity .25s var(--ease),visibility 0s linear .25s}
  .v-kinetic.is-open{opacity:1;transition:opacity .25s var(--ease)}
  .v-kinetic .demo-nav a > span{opacity:0;transform:translateX(-60px) skewX(-8deg);transition:opacity .4s var(--ease),transform .45s var(--ease)}
  .v-kinetic.is-open .demo-nav a > span{opacity:1;transform:translateX(0) skewX(0)}
  .v-kinetic.is-open .demo-nav a:nth-child(1) > span{transition-delay:.05s}
  .v-kinetic.is-open .demo-nav a:nth-child(2) > span{transition-delay:.10s}
  .v-kinetic.is-open .demo-nav a:nth-child(3) > span{transition-delay:.15s}
  .v-kinetic.is-open .demo-nav a:nth-child(4) > span{transition-delay:.20s}
  .v-kinetic.is-open .demo-nav a:nth-child(5) > span{transition-delay:.25s}
</style>
</head>
<body>
  <h1>Mobile menu — animation options</h1>
  <p class="sub">Tap a style to open it full-screen. The X (top-right) closes. Tap the same one again to replay. Tell me which you want on the real site — or mix elements from a few.</p>

  <div class="triggers">
    <button class="trig" data-v="v-curtain">1 · Curtain + Cascade <small>current — panel wipes down, links stagger up</small></button>
    <button class="trig" data-v="v-circle">2 · Circle Expand <small>grows from the hamburger corner</small></button>
    <button class="trig" data-v="v-slide">3 · Slide Panel <small>slides in from the right</small></button>
    <button class="trig" data-v="v-split">4 · Split Reveal <small>two panels part from the center</small></button>
    <button class="trig" data-v="v-kinetic">5 · Kinetic <small>snappy skewed slide-in</small></button>
  </div>

  <div class="demo-menu" id="demoMenu">
    <span class="variant-tag" id="variantTag"></span>
    <button class="demo-close" id="demoClose" aria-label="Close">&#10005;</button>
    <nav class="demo-nav">
      <a href="#"><span>Work</span></a>
      <a href="#"><span>Process</span></a>
      <a href="#"><span>About</span></a>
      <a href="#"><span>Services</span></a>
      <a href="#" class="cta"><span>Start a project</span></a>
    </nav>
    <div class="demo-foot">me@iamnatewinter.com&nbsp;&nbsp;·&nbsp;&nbsp;Instagram&nbsp;&nbsp;·&nbsp;&nbsp;LinkedIn</div>
  </div>

  <script>
    const menu = document.getElementById('demoMenu');
    const tag = document.getElementById('variantTag');
    const labels = {'v-curtain':'1 · Curtain + Cascade','v-circle':'2 · Circle Expand','v-slide':'3 · Slide Panel','v-split':'4 · Split Reveal','v-kinetic':'5 · Kinetic'};
    document.querySelectorAll('.trig').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const v = btn.dataset.v;
        menu.className = 'demo-menu';        // reset
        void menu.offsetWidth;                // reflow so animation replays
        menu.classList.add(v);
        tag.textContent = labels[v];
        void menu.offsetWidth;
        menu.classList.add('is-open');
      });
    });
    document.getElementById('demoClose').addEventListener('click',()=>menu.classList.remove('is-open'));
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') menu.classList.remove('is-open'); });
  </script>
</body>
</html>
