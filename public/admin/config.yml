# Sveltia CMS config — the editing dashboard for iamnatewinter.com
#
# LOCAL TESTING: with `npm run dev` running, also run the proxy:
#   npx @sveltia/cms-proxy-server
# then open http://localhost:4400/admin/ — edits save straight to your files.
#
# PRODUCTION: set the `backend` repo to your GitHub repo and edits commit there.

backend:
  name: github
  repo: nwinter03/iamnatewinter-site   # GitHub repo the live CMS commits to
  branch: main
  base_url: https://sveltia-cms-auth.nwinter03.workers.dev   # auth helper for live /admin/ login

# Enables editing local files during `npm run dev` (no GitHub needed to test)
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # ---------- SITE COPY (single file, all the page text) ----------
  - name: "site"
    label: "Site Copy"
    delete: false
    editor:
      preview: false
    files:
      - name: "copy"
        label: "All Page Copy"
        file: "src/data/site.json"
        fields:
          # Order mirrors the page top-to-bottom. SEO sits up top (it is the
          # browser tab + Google result, not a visible section). Each section
          # carries its own Eyebrow + Headline right above its content.

          # ---- SEO ----
          - label: "SEO (browser tab + Google result)"
            name: "seo"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Page title", name: "title", widget: "string", hint: "Shows in the browser tab and as the Google result title." }
              - { label: "Meta description", name: "description", widget: "text", hint: "The grey summary under your title in Google (~150-160 characters)." }

          # ---- HERO ----
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Title — line 1", name: "line1", widget: "string" }
              - { label: "Title — line 2", name: "line2", widget: "string" }
              - { label: "Title — line 3 (italic)", name: "line3", widget: "string" }
              - { label: "Title — line 4 (italic)", name: "line4", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "markdown", minimal: true, hint: "Body copy under the headline. Blank line = new paragraph; toolbar for bold/italic." }
              - { label: "Reel — Vimeo ID", name: "reelVimeoId", widget: "string", hint: "Just the numeric ID from the Vimeo URL, e.g. 817702560." }
              - { label: "Reel — duration label", name: "reelDuration", widget: "string", hint: "Shown on the reel button, e.g. 0:47." }

          # ---- MARQUEE (scrolling sectors, just under the hero) ----
          - label: "Marquee terms"
            name: "marquee"
            widget: "list"
            field: { label: "Term", name: "term", widget: "string" }
          - { label: "Marquee lead-in (optional)", name: "marqueeLabel", widget: "string", required: false, hint: "Optional text before the looping sectors, e.g. 'Built for'. Leave empty for none." }

          # ---- WORK (section header; portfolio images are edited under “Work” in the sidebar) ----
          - label: "Work"
            name: "work"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Wrap the italic phrase in *asterisks*. Press Enter to put the next part on its own line. (Portfolio images are edited under “Work” in the left sidebar.)" }

          # ---- PROCESS ----
          - label: "Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Wrap the italic phrase in *asterisks*. Press Enter to put the next part on its own line." }
              - label: "Steps"
                name: "steps"
                widget: "list"
                label_singular: "Step"
                collapsed: true
                summary: "{{fields.label}}"
                fields:
                  - { label: "Label", name: "label", widget: "string", hint: "e.g. Direction — the '01 ·' number is added automatically." }
                  - { label: "Body", name: "body", widget: "text" }

          # ---- ABOUT ----
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Wrap the italic phrase in *asterisks*. Press Enter to put the next part on its own line." }
              - { label: "Portrait photo", name: "portrait", widget: "image", required: false, hint: "Still shown before the video loads (and for reduced-motion visitors). Drag/drop to upload." }
              - { label: "Portrait video (optional, silent loop)", name: "portraitVideo", widget: "file", required: false, hint: "An MP4 that autoplays muted and loops in the About portrait. Leave empty to show just the photo." }
              - { label: "Lead line", name: "lead", widget: "text", hint: "The brighter opening line, e.g. 'Hi, I'm Nate Winter.'" }
              - { label: "Body", name: "body", widget: "markdown", minimal: true, hint: "The main About story. Use the toolbar for bold, italic, links, etc. Blank line = new paragraph." }

          # ---- SERVICES ----
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Wrap the italic phrase in *asterisks*. Press Enter to put the next part on its own line." }
              - label: "Items"
                name: "items"
                widget: "list"
                label_singular: "Service"
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { label: "Group", name: "group", widget: "select", options: ["Product Visualization", "Brand & Direction"] }
                  - { label: "Number", name: "num", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Tag", name: "tag", widget: "string" }

          # ---- CONTACT ----
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "title", widget: "text", hint: "Wrap the italic phrase in *asterisks*. Press Enter to put the next part on its own line." }
              - { label: "Lead paragraph", name: "lead", widget: "markdown", minimal: true }
              - { label: "What to expect", name: "expect", widget: "list", field: { label: "Step", name: "step", widget: "string" } }
              - { label: "Project types (contact form dropdown)", name: "projectTypes", widget: "list", field: { label: "Option", name: "option", widget: "string" } }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin", widget: "string" }

  # ---------- WORK (one bulk gallery per category) ----------
  - name: "work"
    label: "Work"
    delete: false
    editor: { preview: false }
    files:
      - name: "animation"
        label: "Product Animation"
        file: "src/content/galleries/animation.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "animation" }
          - { label: "Label", name: "label", widget: "hidden", default: "Product Animation" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "Pieces"
            name: "items"
            label_singular: "Piece"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image (poster)", name: "image", widget: "image", hint: "Drag/drop or pick. The still shown before hover." }
              - { label: "Video URL", name: "video", widget: "string", required: false, hint: "Plays on hover + in the lightbox." }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
      - name: "stills"
        label: "Product Stills"
        file: "src/content/galleries/stills.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "stills" }
          - { label: "Label", name: "label", widget: "hidden", default: "Product Stills" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "Images"
            name: "items"
            label_singular: "Image"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image", hint: "Drag/drop to upload." }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
      - name: "motion"
        label: "Motion Graphics"
        file: "src/content/galleries/motion.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "motion" }
          - { label: "Label", name: "label", widget: "hidden", default: "Motion Graphics" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "Pieces"
            name: "items"
            label_singular: "Piece"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image (poster)", name: "image", widget: "image" }
              - { label: "Video URL", name: "video", widget: "string", required: false, hint: "Plays on hover + in the lightbox." }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
      - name: "packaging"
        label: "Packaging Design"
        file: "src/content/galleries/packaging.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "packaging" }
          - { label: "Label", name: "label", widget: "hidden", default: "Packaging Design" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "360° Products"
            name: "items"
            label_singular: "Product"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "First frame image", name: "image", widget: "image", hint: "The thumbnail shown in the grid." }
              - { label: "360° folder", name: "spinFolder", widget: "string", hint: "e.g. 2025/12" }
              - { label: "360° filename prefix", name: "spinPrefix", widget: "string", hint: "e.g. treatos_" }
              - { label: "360° frame count", name: "spinCount", widget: "number", default: 12 }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
      - name: "branding"
        label: "Logo / Branding"
        file: "src/content/galleries/branding.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "branding" }
          - { label: "Label", name: "label", widget: "hidden", default: "Logo / Branding" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "Images"
            name: "items"
            label_singular: "Image"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
      - name: "artwork"
        label: "Artwork"
        file: "src/content/galleries/artwork.md"
        fields:
          - { label: "Category", name: "category", widget: "hidden", default: "artwork" }
          - { label: "Label", name: "label", widget: "hidden", default: "Artwork" }
          - { label: "Order", name: "order", widget: "select", options: ["curated", "random"], default: "curated", hint: "Curated keeps the order below. Random reshuffles this category each time you publish." }
          - label: "Images"
            name: "items"
            label_singular: "Image"
            widget: "list"
            summary: "{{fields.title}}"
            thumbnail: "image"
            collapsed: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Image", name: "image", widget: "image" }
              - { label: "Swatch (fallback color)", name: "swatch", widget: "select", default: "navy", options: ["bone","cream","ember","navy","violet","rust","lime"] }
